services:
  app:
    build: .
    container_name: blog_api
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      TOKEN_SECRET: change-me-in-production
      DATA_DIR: /app/data
      LOG_FILE: /app/data/log.txt
    volumes:
      - ./data:/app/data

